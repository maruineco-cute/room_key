<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10141c" />
  <title>Room Key Atelier — 3D Key Maker</title>
  <link rel="stylesheet" href="style.css?v=20261011-9" />
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">3D ROOM KEY MAKER</p>
        <h1>Room Key <em>Atelier</em></h1>
      </div>
      <div class="header-note"><span class="live-dot"></span> ブラウザ内で完結</div>
    </header>

    <section class="workspace" aria-label="ルームキー作成画面">
      <aside class="controls" aria-label="デザイン操作">
        <div class="control-intro">
          <h2>デザイン</h2>
          <p>画像と文字は端末内だけで処理されます。</p>
        </div>

        <section class="control-section side-picker global-side-picker" aria-labelledby="side-heading">
          <div class="section-heading"><h3 id="side-heading">印刷する面</h3><span id="activeSideLabel">表面</span></div>
          <div class="segmented" role="group" aria-label="編集面の切り替え">
            <button class="side-button active" type="button" data-side="front">表面</button>
            <button class="side-button" type="button" data-side="back">裏面</button>
          </div>
        </section>

        <nav class="editor-tabs" role="tablist" aria-label="編集メニュー">
          <button class="editor-tab active" type="button" role="tab" aria-selected="true" data-editor-tab="basic">基本</button>
          <button class="editor-tab" type="button" role="tab" aria-selected="false" data-editor-tab="image">画像</button>
          <button class="editor-tab" type="button" role="tab" aria-selected="false" data-editor-tab="text">文字</button>
          <button class="editor-tab" type="button" role="tab" aria-selected="false" data-editor-tab="save">保存</button>
        </nav>

        <section class="control-section editor-panel" data-editor-panel="basic" aria-labelledby="shape-heading">
          <div class="section-heading"><h3 id="shape-heading">キーホルダーの形</h3><span id="shapeName">モーテル型</span></div>
          <div class="shape-picker" role="group" aria-label="キーホルダーの形を選択">
            <button class="shape-button active" type="button" data-shape="motel">
              <span class="shape-sample motel-sample" aria-hidden="true"></span><span><strong>モーテル型</strong><small>添付イメージ風</small></span>
            </button>
            <button class="shape-button" type="button" data-shape="round">
              <span class="shape-sample round-sample" aria-hidden="true"></span><span><strong>ラウンド型</strong><small>なめらかキー型</small></span>
            </button>
            <button class="shape-button" type="button" data-shape="circle">
              <span class="shape-sample circle-sample" aria-hidden="true"></span><span><strong>丸型</strong><small>丸いタグ型</small></span>
            </button>
          </div>
        </section>

        <section class="control-section editor-panel" data-editor-panel="basic" aria-labelledby="color-heading">
          <div class="section-heading"><h3 id="color-heading">本体カラー</h3><span class="color-name" id="colorName">アイボリー</span></div>
          <div class="swatches" role="group" aria-label="本体カラーを選択">
            <button class="swatch active" type="button" data-color="#f4efe5" data-name="アイボリー" aria-label="アイボリー" style="--swatch:#f4efe5"></button>
            <button class="swatch" type="button" data-color="#16181d" data-name="ブラック" aria-label="ブラック" style="--swatch:#16181d"></button>
            <button class="swatch" type="button" data-color="#f39ab6" data-name="ピンク" aria-label="ピンク" style="--swatch:#f39ab6"></button>
            <button class="swatch" type="button" data-color="#8cd7ea" data-name="水色" aria-label="水色" style="--swatch:#8cd7ea"></button>
            <button class="swatch clear-swatch" type="button" data-color="clear" data-name="クリア" aria-label="クリア（透明）" title="クリア（透明）"></button>
            <label class="custom-color" title="カスタムカラー">
              <input id="bodyColor" type="color" value="#f4efe5" aria-label="カスタムカラー" />
              <span>＋</span>
            </label>
          </div>
        </section>

        <section class="control-section editor-panel" data-editor-panel="image" aria-labelledby="image-heading" hidden>
          <div class="section-heading"><h3 id="image-heading">ロゴ・画像</h3><span class="side-mini" id="uploadSideLabel">表面用</span></div>
          <label class="upload-box" for="imageUpload">
            <input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
            <span class="upload-icon" aria-hidden="true">↑</span>
            <span><strong>画像を選択</strong><small>PNG / JPEG / WebP</small></span>
          </label>
          <button type="button" id="removeImage" class="text-button">この面の画像を削除</button>
          <div class="range-stack image-controls">
            <label>画像サイズ <output id="imageScaleOutput"></output><input id="imageScale" type="range" min="0.25" max="1.6" step="0.01" /></label>
            <label>画像の左右 <output id="imageXOutput"></output><input id="imageX" type="range" min="-0.75" max="0.75" step="0.01" /></label>
            <label>画像の上下 <output id="imageYOutput"></output><input id="imageY" type="range" min="-0.75" max="0.75" step="0.01" /></label>
          </div>
        </section>

        <section class="control-section editor-panel" data-editor-panel="text" aria-labelledby="text-heading" hidden>
          <div class="section-heading"><h3 id="text-heading">文字</h3><span class="side-mini" id="textSideLabel">表面用</span></div>
          <div class="text-visibility"><span>文字を表示</span><button id="textVisibility" class="visibility-switch is-on" type="button" role="switch" aria-checked="true"><span class="switch-knob"></span><b>ON</b></button></div>
          <label class="field-label" for="textInput">ホテル名・部屋番号など</label>
          <textarea id="textInput" rows="3" maxlength="110" placeholder="例：HOTEL AURORA&#10;ROOM 301"></textarea>
          <div class="text-settings">
            <label>文字色 <input id="textColor" type="color" value="#263344" /></label>
            <label>文字サイズ <output id="textSizeOutput"></output><input id="textSize" type="range" min="22" max="110" step="1" /></label>
          </div>
          <div class="range-stack">
            <label>文字の左右 <output id="textXOutput"></output><input id="textX" type="range" min="-0.65" max="0.65" step="0.01" /></label>
            <label>文字の上下 <output id="textYOutput"></output><input id="textY" type="range" min="-0.65" max="0.65" step="0.01" /></label>
          </div>
        </section>

        <div class="editor-panel save-panel" data-editor-panel="save" hidden>
          <div class="export-block">
            <div><strong>透明背景PNG</strong><small>キーの外側は透明で保存されます</small></div>
            <div class="export-actions">
              <button type="button" class="export-button" data-export="front">表面を保存</button>
              <button type="button" class="export-button" data-export="back">裏面を保存</button>
            </div>
          </div>
          <div class="control-footer">
            <button id="resetButton" type="button" class="reset-button"><span aria-hidden="true">↺</span> 初期状態に戻す</button>
          </div>
        </div>
      </aside>

      <section class="preview-panel" aria-label="3Dプレビュー">
        <div class="preview-topbar">
          <div class="preview-label"><span class="preview-icon">◇</span> LIVE 3D PREVIEW</div>
          <button type="button" id="recenterButton" class="recenter-button" title="角度を戻す">正面に戻す</button>
        </div>
        <div id="canvasWrap" class="canvas-wrap" role="application" aria-label="3Dルームキー。ドラッグで回転、タップで揺らします。">
          <div id="threeMount" class="three-mount"></div>
          <div class="scroll-lane" aria-hidden="true"><span>SCROLL</span></div>
          <div class="canvas-glow" aria-hidden="true"></div>
          <div id="hint" class="gesture-hint"><span class="hint-drag">↔</span><span>ドラッグで回転</span><i></i><span class="hint-tap">⌁</span><span>タップで揺れる</span></div>
        </div>
        <div class="preview-bottom"><span>表・裏の印刷は別々に編集できます</span><span class="privacy-note">画像はアップロードされません</span></div>
      </section>
    </section>
  </main>
  <script type="module" src="app.js?v=20261011-9"></script>
</body>
</html>
